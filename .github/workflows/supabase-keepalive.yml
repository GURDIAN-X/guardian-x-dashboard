name: Supabase keep-alive

# Pings the Guardian-X Supabase project every 3 days so the Free plan
# never auto-pauses it (pause happens after 7 days without activity).
# Uses only the PUBLIC anon key that is already in index.html. No secrets.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the REST API
        run: |
          URL="https://djshmmpjrvymrjpumegj.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqc2htbXBqcnZ5bXJqcHVtZWdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0ODMwOTUsImV4cCI6MjA3NTA1OTA5NX0.gFlX4nSudLOhcupnzqLaDcPKX_pRgTKqnzeQFe3y7VQ"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$URL/rest/v1/templates?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "attempt $i -> HTTP $CODE"
            # 000 = no connection (project paused/offline). Any HTTP answer means the server is awake.
            if [ "$CODE" != "000" ]; then exit 0; fi
            sleep 20
          done
          echo "Supabase did not answer: project may be paused" && exit 1
